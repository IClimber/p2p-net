# p2p-net: порт 443 ділять HTTPS (сервер сигналізації) і TURN поверх TLS — для мереж, де відкритий лише 443/TCP.
# Розподіл за ALPN: браузери для HTTPS і WebSocket завжди надсилають ALPN (h2/http/1.1),
# а TURN-клієнти браузерів — ні (або "stun.turn", RFC 7443).
stream {
    map $ssl_preread_alpn_protocols $p2p_backend {
        ""                 127.0.0.1:4431;
        ~(^|,)stun\.turn   127.0.0.1:4431;
        default            127.0.0.1:4430;
    }

    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $p2p_backend;
        proxy_protocol on;          # справжня IP клієнта для ліміту запитів у HTTP
    }

    # TURN/TLS: nginx знімає TLS і передає звичайний TURN/TCP у coturn
    server {
        listen 127.0.0.1:4431 ssl proxy_protocol;
        ssl_certificate /etc/letsencrypt/live/@@HOST@@/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/@@HOST@@/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        proxy_pass @@BIND_IP@@:3478;
        proxy_timeout 30m;
    }
}
