# p2p-net: TURN (TURN REST API, тимчасові облікові дані видає сервер сигналізації)
listening-port=3478
listening-ip=@@BIND_IP@@
relay-ip=@@BIND_IP@@
external-ip=@@EXTERNAL_IP@@
min-port=49152
max-port=65535

realm=@@HOST@@
use-auth-secret
static-auth-secret=@@TURN_SECRET@@
fingerprint
stale-nonce=600

no-tls
no-dtls
no-cli
no-multicast-peers

# Не пускати relay у приватні/службові мережі
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

syslog
simple-log
# Квоти: user-quota рахується за частиною імені після ':', а сервер сигналізації робить її унікальною
# на кожен welcome — тобто квота діє на одне завантаження сторінки
total-quota=2000
user-quota=100
max-bps=64000
bps-capacity=6250000
no-tcp-relay
