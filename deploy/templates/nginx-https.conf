# p2p-net: HTTPS для сервера сигналізації. 443 приймає stream-проксі (/etc/nginx/stream.d/p2p-net.conf)
# і передає сюди з proxy_protocol.

# З'єднання з сервером сигналізації: не більше 30/хв з однієї IP (плюс запас 20)
limit_req_zone $binary_remote_addr zone=p2pws:1m rate=30r/m;

server {
    listen 127.0.0.1:4430 ssl proxy_protocol;
    server_name @@HOST@@;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    ssl_certificate /etc/letsencrypt/live/@@HOST@@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@@HOST@@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:p2pnet:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # WebSocket сервера сигналізації (p2p-signal.service)
    location = /ws {
        limit_req zone=p2pws burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:@@SIGNAL_PORT@@;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
    location / { return 404; }
}
